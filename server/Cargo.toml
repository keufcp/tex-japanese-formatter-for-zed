[package]
name = "tex-japanese-formatter-lsp"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "tex-japanese-formatter-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
