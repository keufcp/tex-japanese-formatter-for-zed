name: release-lsp

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-upload:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: tex-japanese-formatter-lsp
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: tex-japanese-formatter-lsp
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: tex-japanese-formatter-lsp
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: tex-japanese-formatter-lsp
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: tex-japanese-formatter-lsp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} --manifest-path server/Cargo.toml

      - name: Build (cargo)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} --manifest-path server/Cargo.toml

      - name: Prepare asset
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="${{ matrix.binary }}"
          TARGET="${{ matrix.target }}"
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            SRC="server/target/${TARGET}/release/${BIN_NAME}.exe"
            OUT="${BIN_NAME}-${TARGET}.exe"
          else
            SRC="server/target/${TARGET}/release/${BIN_NAME}"
            OUT="${BIN_NAME}-${TARGET}"
          fi
          if [[ ! -f "$SRC" ]]; then
            echo "Binary not found: $SRC"
            exit 1
          fi
          cp "$SRC" "$OUT"
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare.outputs.asset }}
